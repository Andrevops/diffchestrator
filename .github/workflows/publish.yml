name: Release Extension

on:
  push:
    tags:
      - "v*"

# Read-only by default; only the publish job is granted write scopes.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Build: no secrets, read-only token ───────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags are needed for the compare link
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Verify tag matches package.json version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install extension dependencies
        run: npm ci

      - name: Install webview dependencies
        run: npm ci --prefix webview-ui

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build and package .vsix (Marketplace — andrevops-com)
        run: npm run package

      - name: Package .vsix (Open VSX — andrevops)
        run: npm run package:openvsx

      - name: Verify package.json is unchanged
        run: git diff --exit-code -- package.json

      - name: Generate checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256sum "diffchestrator-${VERSION}.vsix" "diffchestrator-${VERSION}-openvsx.vsix" > checksums.txt
          cat checksums.txt

      - name: Release notes (from CHANGELOG.md)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)
          {
            echo "## What's Changed"
            echo ""
            node scripts/release-notes.mjs "${VERSION}"
            echo ""
            echo "---"
            if [ -n "${PREV_TAG}" ]; then
              echo "**Full Changelog**: [\`${PREV_TAG}..${GITHUB_REF_NAME}\`](https://github.com/${REPO}/compare/${PREV_TAG}...${GITHUB_REF_NAME})"
              echo ""
            fi
            echo "## Verify"
            echo ""
            echo '```sh'
            echo "# Primary: verify build provenance (SLSA attestation from this workflow)"
            echo "gh attestation verify diffchestrator-${VERSION}.vsix --repo ${REPO}"
            echo ""
            echo "# Secondary: verify the checksum signature (see README for the pinned key fingerprint)"
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/${GITHUB_REF_NAME}/public_key.pem -o public_key.pem"
            echo "xxd -r -p checksums.txt.sig | openssl pkeyutl -verify -pubin -inkey public_key.pem -rawin -in checksums.txt -sigfile /dev/stdin"
            echo "sha256sum -c checksums.txt"
            echo '```'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            diffchestrator-${{ steps.version.outputs.version }}.vsix
            diffchestrator-${{ steps.version.outputs.version }}-openvsx.vsix
            checksums.txt
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

  # ── Publish: write scopes + secrets, gated by the `release` environment ─
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # build provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      HAS_VSCE: ${{ secrets.VSCE_PAT != '' }}
    steps:
      # Checkout is only for package-lock.json → pinned vsce/ovsx; nothing is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # --ignore-scripts: no dependency lifecycle scripts run in the job holding
      # write scopes and an OIDC token. vsce/ovsx publish do not need them.
      - name: Install pinned publishing tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: Verify checksums
        working-directory: release
        run: sha256sum -c checksums.txt

      - name: Sign checksums
        working-directory: release
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          umask 077
          KEY="${RUNNER_TEMP}/signing.pem"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 -d > "$KEY"
          openssl pkey -in "$KEY" -noout
          openssl pkeyutl -sign -inkey "$KEY" -rawin -in checksums.txt \
            | xxd -p -c 256 | tr -d '\n' > checksums.txt.sig
          echo "signature: $(cat checksums.txt.sig)"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release/*.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/*.vsix
            release/checksums.txt
            release/checksums.txt.sig
          body_path: release/RELEASE_NOTES.md
          fail_on_unmatched_files: true

      # Publishes the exact CI-built, attested .vsix. Skipped (not failed) until
      # the VSCE_PAT secret is configured on the `release` environment.
      - name: Publish to VS Code Marketplace
        if: env.HAS_VSCE == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --no-dependencies --packagePath "release/diffchestrator-${VERSION}.vsix"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx publish --packagePath "release/diffchestrator-${VERSION}-openvsx.vsix"
