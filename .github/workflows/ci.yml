name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, lint, package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Install extension dependencies
        run: npm ci

      - name: Install webview dependencies
        run: npm ci --prefix webview-ui

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Floating/misused promises are errors and fail CI; unused vars are warnings.
      - name: Lint
        run: npm run lint

      - name: Build and package (Marketplace)
        run: npm run package

      - name: List packaged files
        run: npx --no-install vsce ls --no-dependencies

      - name: Upload .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ github.sha }}
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 7
